# Master Documentation Manifest — Single Source of Truth
# This file declares every crate's purpose, public API surface,
# capabilities, and relationships. Generated docs derive from this.

[project_chirho]
name_chirho = "rhema_chirho"
tagline_chirho = "Biblical scholarship engine in Pure Rust"
version_chirho = "0.1.0"
license_chirho = "GPL-2.0-or-later"
repository_chirho = "https://github.com/loveJesus/rsword-chirho"
description_chirho = """
Rhema Chirho is a multi-crate workspace providing a complete biblical \
scholarship engine: query parsing, planning, indexing, execution, and \
integration surfaces (CLI, GUI, REST API, WASM, FFI, AI).
"""

