# For God so loved the world that he gave his only begotten Son,
# that whoever believes in him should not perish but have eternal life.
# John 3:16

[package]
name = "rhema_ffi_chirho"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "C FFI bindings for non-Rust consumers"
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rhema_contracts_chirho.workspace = true
rhema_core_chirho.workspace = true
rhema_integration_chirho.workspace = true
rhema_query_chirho.workspace = true
serde_json.workspace = true
log.workspace = true

[lints.rust]
# FFI requires unsafe code — override workspace forbid
unsafe_code = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
